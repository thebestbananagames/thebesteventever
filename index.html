<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown — 2 december 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #111111;
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1rem;
      overflow-x: hidden;
    }

    .countdown {
      font-size: 17vw;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
      white-space: nowrap;
      margin-bottom: 2rem;
    }

    .address {
      font-size: clamp(1.2rem, 3.5vw, 2.5rem);
      font-weight: 300;
      color: #333333;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .address:hover,
    .address:focus {
      color: #000000;
      border-bottom-color: #000000;
    }
  </style>
</head>
<body>
  <div id="countdown" class="countdown">00:00:00:00</div>
  <a
    class="address"
    href="https://rsn.s.gy/LbJ0"
    target="_blank"
    rel="noopener noreferrer"
  >MARIAM MAKEBAPLEIN 1, 9000 GENT</a>

  <script>
    // Doeldatum: woensdag 2 december 2026 om 12:00 (Belgische tijd, CET / UTC+1)
    const targetDate = new Date("2026-12-02T12:00:00+01:00").getTime();
    const countdownEl = document.getElementById("countdown");

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function updateCountdown() {
      const now = Date.now();
      const diff = targetDate - now;

      if (diff <= 0) {
        countdownEl.textContent = "00:00:00:00";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      countdownEl.textContent = `${pad(days)}:${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
